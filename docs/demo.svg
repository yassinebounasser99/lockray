<svg xmlns="http://www.w3.org/2000/svg" width="873" height="512" viewBox="0 0 873 512" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="873" height="512" rx="10" fill="#0d1117"/>
  <rect width="873" height="32" rx="10" fill="#161b22"/>
  <rect y="22" width="873" height="10" fill="#161b22"/>
  <circle cx="20" cy="16" r="6" fill="#ff5f57"/><circle cx="40" cy="16" r="6" fill="#febc2e"/><circle cx="60" cy="16" r="6" fill="#28c840"/>
  <text x="20" y="60" xml:space="preserve"><tspan fill="#a371f7">$</tspan><tspan fill="#e6edf3"> npx lockray examples/before.package-lock.json examples/after.package-lock.json</tspan></text>
  <text x="20" y="80" xml:space="preserve"></text>
  <text x="20" y="100" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">lockray</tspan><tspan fill="#8b949e">  examples/before.package-lock.json → examples/after.package-lock.json</tspan></text>
  <text x="20" y="120" xml:space="preserve"></text>
  <text x="20" y="140" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">after.package-lock.json</tspan></text>
  <text x="20" y="160" xml:space="preserve"><tspan fill="#8b949e">  +3 added  ↑1 changed  -0 removed  </tspan><tspan fill="#ff7b72">⚠ 1 modified in place</tspan></text>
  <text x="20" y="180" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72" font-weight="700">HIGH  </tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">colors-util</tspan><tspan fill="#8b949e">@2.0.0</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[insecure-source]</tspan></text>
  <text x="20" y="200" xml:space="preserve"><tspan fill="#e6edf3">         Downloaded over plain HTTP from registry.npmjs.org</tspan></text>
  <text x="20" y="220" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72" font-weight="700">HIGH  </tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">lodash</tspan><tspan fill="#8b949e">@4.17.21</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[integrity-changed]</tspan></text>
  <text x="20" y="240" xml:space="preserve"><tspan fill="#e6edf3">         Integrity hash changed but the version didn't. A published npm version is immutable, so the</tspan></text>
  <text x="20" y="260" xml:space="preserve"><tspan fill="#e6edf3">         tarball was swapped.</tspan></text>
  <text x="20" y="280" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#ff7b72" font-weight="700">HIGH  </tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">lodash</tspan><tspan fill="#8b949e">@4.17.21</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[source-changed]</tspan></text>
  <text x="20" y="300" xml:space="preserve"><tspan fill="#e6edf3">         Download URL changed for the same version: https://registry.npmjs.org/lodash/-/lodash-4.17.21.tgz</tspan></text>
  <text x="20" y="320" xml:space="preserve"><tspan fill="#e6edf3">         → https://cdn.evil.example/lodash-4.17.21.tgz</tspan></text>
  <text x="20" y="340" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">MEDIUM</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">expresss</tspan><tspan fill="#8b949e">@1.0.2</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[install-script]</tspan></text>
  <text x="20" y="360" xml:space="preserve"><tspan fill="#e6edf3">         Runs an install script (preinstall/install/postinstall) on every npm install</tspan></text>
  <text x="20" y="380" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#e3b341">MEDIUM</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">expresss</tspan><tspan fill="#8b949e">@1.0.2</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[typosquat]</tspan></text>
  <text x="20" y="400" xml:space="preserve"><tspan fill="#e6edf3">         Name is suspiciously close to the popular package "express"</tspan></text>
  <text x="20" y="420" xml:space="preserve"><tspan fill="#e6edf3">  </tspan><tspan fill="#8b949e">INFO  </tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#e6edf3" font-weight="700">express</tspan><tspan fill="#8b949e">@5.1.0</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#8b949e">[major-bump]</tspan></text>
  <text x="20" y="440" xml:space="preserve"><tspan fill="#e6edf3">         Major version bump 4.21.2 → 5.1.0</tspan></text>
  <text x="20" y="460" xml:space="preserve"></text>
  <text x="20" y="480" xml:space="preserve"><tspan fill="#ff7b72" font-weight="700">3 high</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#e3b341">2 medium</tspan><tspan fill="#8b949e"> · </tspan><tspan fill="#8b949e">1 info</tspan></text>
</svg>
